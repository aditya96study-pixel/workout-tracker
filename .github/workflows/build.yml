name: Build APK

# Runs on every push, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: flutter --version

      # The repo holds only lib/ and pubspec.yaml. The android/ folder is
      # generated here so it always matches the Flutter version on the runner,
      # rather than being a stale copy checked into the repo.
      # lib/ and pubspec.yaml are parked first because `flutter create`
      # rewrites both.
      - name: Scaffold the Android project
        run: |
          set -euo pipefail
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --platforms=android --project-name workout_tracker --org com.aditya .
          rm -rf lib pubspec.yaml
          cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Set the home-screen name
        run: |
          sed -i 's/android:label="workout_tracker"/android:label="Workout Tracker"/' \
            android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Fetch packages
        run: flutter pub get

      # Only runs if you have added an icon; skipped silently otherwise.
      - name: Generate launcher icons
        run: |
          if [ -f assets/icon/icon.png ] && grep -q '^flutter_launcher_icons:' pubspec.yaml; then
            dart run flutter_launcher_icons
          else
            echo "No icon configured - skipping."
          fi

      - name: Build release APK
        run: flutter build apk --release

      # Flutter debug-signs release builds, and this runner generates a fresh
      # debug key on every run — so each build would carry a different
      # signature, Android would reject it as an update of the app already on
      # the phone, and the only way in would be an uninstall that wipes the
      # workout database.
      #
      # signing/debug.keystore is the one copied from the PC that built the
      # APK currently installed. Re-signing with it makes every APK built here
      # a legitimate update of that install: it goes straight over the top and
      # the database is untouched. Local builds stay interchangeable too.
      - name: Re-sign with the original debug key
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" sign \
            --ks signing/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            build/app/outputs/flutter-apk/app-release.apk
          echo "--- signature on the APK you will install ---"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Rename for download
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/workout-tracker-$(date +%Y%m%d-%H%M).apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-apk
          path: out/*.apk
          retention-days: 90

name: Build APK

# Runs on every push, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: flutter --version

      # The repo holds only lib/ and pubspec.yaml. The android/ folder is
      # generated here so it always matches the Flutter version on the runner,
      # rather than being a stale copy checked into the repo.
      # lib/ and pubspec.yaml are parked first because `flutter create`
      # rewrites both.
      - name: Scaffold the Android project
        run: |
          set -euo pipefail
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          # --org MUST stay com.example: it sets the applicationId, and the
          # phone already has com.example.workout_tracker installed from the
          # local `flutter create workout_tracker` build. Change this and
          # Android installs a second, empty app instead of updating the
          # existing one — which is exactly what went wrong the first time.
          flutter create --platforms=android --project-name workout_tracker --org com.example .
          rm -rf lib pubspec.yaml
          cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      # Sets the launcher name and hard-strips storage permissions. The file
      # picker only ever opens a document through the Storage Access Framework,
      # which needs no permission at all — but plugins commonly declare legacy
      # storage permissions anyway, and manifest merging would pull them into
      # this app. tools:node="remove" deletes them from the merged result, so
      # the app stays at zero permissions no matter what a dependency asks for.
      - name: Patch the AndroidManifest
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ',
                            '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)

          s = re.sub(r'android:label="[^"]*"', 'android:label="Workout Tracker"', s, count=1)

          strip = [
              'READ_EXTERNAL_STORAGE', 'WRITE_EXTERNAL_STORAGE',
              'MANAGE_EXTERNAL_STORAGE', 'READ_MEDIA_IMAGES',
              'READ_MEDIA_VIDEO', 'READ_MEDIA_AUDIO',
              'READ_MEDIA_VISUAL_USER_SELECTED',
          ]
          block = '\n'.join(
              f'    <uses-permission android:name="android.permission.{n}" tools:node="remove" />'
              for n in strip)

          m = re.search(r'<manifest[^>]*>', s)
          s = s[:m.end()] + '\n' + block + s[m.end():]
          p.write_text(s)
          print(s[:1400])
          PYEOF

      - name: Fetch packages
        run: flutter pub get

      # Only runs if you have added an icon; skipped silently otherwise.
      - name: Generate launcher icons
        run: |
          if [ -f assets/icon/icon.png ] && grep -q '^flutter_launcher_icons:' pubspec.yaml; then
            dart run flutter_launcher_icons
          else
            echo "No icon configured - skipping."
          fi

      - name: Build release APK
        run: flutter build apk --release

      # Flutter debug-signs release builds, and this runner generates a fresh
      # debug key on every run — so each build would carry a different
      # signature, Android would reject it as an update of the app already on
      # the phone, and the only way in would be an uninstall that wipes the
      # workout database.
      #
      # signing/debug.keystore is the one copied from the PC that built the
      # APK currently installed. Re-signing with it makes every APK built here
      # a legitimate update of that install: it goes straight over the top and
      # the database is untouched. Local builds stay interchangeable too.
      - name: Re-sign with the original debug key
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" sign \
            --ks signing/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            build/app/outputs/flutter-apk/app-release.apk
          echo "--- signature on the APK you will install ---"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      # The build log is the receipt: it shows the package id the phone will
      # match against, and every permission that survived the merge.
      - name: Report package id and permissions
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "=== package (must be com.example.workout_tracker to update your app) ==="
          "$AAPT" dump packagename "$APK"
          echo "=== permissions (expected: none at all) ==="
          "$AAPT" dump permissions "$APK" | grep -i "uses-permission" || echo "(no permissions requested)"

      - name: Rename for download
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/workout-tracker-$(date +%Y%m%d-%H%M).apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-apk
          path: out/*.apk
          retention-days: 90
